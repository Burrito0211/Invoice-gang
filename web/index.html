<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Invoice Gang</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#3d85c6" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!--
      Static strings live here as `data-i18n` keys rather than as English, so a
      phrase has exactly one home and no screen can end up half-translated.
      `applyStaticStrings()` fills them on boot and again on every language
      change. See web/src/i18n.ts.
    -->
    <div id="login" class="login" hidden>
      <!-- Sign-in and sign-up share this form; main.ts swaps the button and endpoint. -->
      <form id="login-form">
        <h1>Invoice Gang</h1>
        <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" data-i18n-placeholder="login.username" required />
        <input id="password" type="password" autocomplete="current-password" data-i18n-placeholder="login.password" required />
        <p id="login-hint" class="hint" data-i18n="login.registerHint" hidden></p>
        <button type="submit" id="login-submit"></button>
        <p id="login-error" class="error" hidden></p>
        <button type="button" id="login-switch" class="linky"></button>
      </form>
    </div>

    <div id="app" hidden>
      <header class="topbar">
        <h1>Invoice Gang</h1>
        <nav>
          <button data-view="dashboard" class="active" data-i18n="nav.spend"></button>
          <button data-view="invoices" data-i18n="nav.invoices"></button>
          <button data-view="income" data-i18n="nav.income"></button>
          <button data-view="review" data-i18n="nav.review"></button>
          <button data-view="stats" data-i18n="nav.stats"></button>
        </nav>
        <div class="range">
          <input id="from" type="date" />
          <input id="to" type="date" />
          <label class="upload" id="csv-label" for="csv" data-i18n="action.importCsv"></label>
          <input id="csv" type="file" accept=".csv,text/csv" hidden />
          <!-- Opens the export guide: getting the file out of the portal is the one manual step. -->
          <button id="csv-help" type="button" class="linky" data-i18n="action.csvHelp"></button>
          <!-- Shows the language you would switch *to*, the way the MOF portal does. -->
          <button id="lang" type="button" class="linky" data-i18n="lang.switch"></button>
          <!-- The username; opens the account dialog. -->
          <button id="account" type="button" class="linky" data-i18n-title="nav.account"></button>
          <!-- Also in the account dialog, but signing out should never need finding. -->
          <button id="sign-out-top" type="button" data-i18n="action.signOut"></button>
        </div>
      </header>

      <div id="stale" class="banner" hidden></div>

      <main>
        <section id="view-dashboard" class="view">
          <div class="budget" id="budget"></div>
          <div class="totals" id="totals"></div>
          <div class="panels">
            <div class="panel">
              <h2 data-i18n="panel.byCategory"></h2>
              <div id="chart-category"></div>
            </div>
            <div class="panel">
              <h2 data-i18n="panel.byMonth"></h2>
              <div id="chart-month"></div>
            </div>
            <div class="panel">
              <h2 data-i18n="panel.topMerchants"></h2>
              <div id="chart-merchant"></div>
            </div>
          </div>
        </section>

        <section id="view-invoices" class="view" hidden>
          <input id="search" type="search" data-i18n-placeholder="search.placeholder" />
          <div id="invoice-list"></div>
          <button id="load-more" data-i18n="action.loadMore" hidden></button>
        </section>

        <section id="view-income" class="view" hidden>
          <p class="hint" data-i18n="income.hint"></p>
          <form id="income-form" class="income-form">
            <input id="income-date" type="date" required />
            <input id="income-amount" type="number" min="1" step="1" data-i18n-placeholder="income.amount" required />
            <input id="income-source" type="text" data-i18n-placeholder="income.source" required />
            <input id="income-note" type="text" data-i18n-placeholder="income.note" />
            <button type="submit" class="upload" data-i18n="action.addIncome"></button>
          </form>
          <div id="income-list"></div>
        </section>

        <section id="view-review" class="view" hidden>
          <p class="hint" data-i18n="review.hint"></p>
          <div id="review-list"></div>
        </section>

        <section id="view-stats" class="view" hidden>
          <div id="stats"></div>
        </section>
      </main>

      <dialog id="detail">
        <div id="detail-body"></div>
        <button id="detail-close" data-i18n="action.close"></button>
      </dialog>

      <dialog id="preview">
        <div class="preview-head">
          <h2 data-i18n="preview.title"></h2>
          <p id="preview-summary" class="muted"></p>
        </div>
        <div id="preview-body"></div>
        <div class="preview-actions">
          <button id="preview-cancel" data-i18n="action.cancel"></button>
          <button id="preview-confirm" class="upload" data-i18n="action.importSelected"></button>
        </div>
      </dialog>

      <!--
        How to export the CSV from the carrier portal. The screenshots in
        /guide/ had every personal detail replaced with placeholders in the page
        before capture — keep it that way if they are ever retaken.
      -->
      <dialog id="guide">
        <div class="preview-head">
          <h2 data-i18n="guide.title"></h2>
          <p class="muted" data-i18n="guide.intro"></p>
        </div>
        <ol class="guide-steps">
          <li>
            <p>
              <span data-i18n="guide.step1"></span>
              <a href="https://www.einvoice.nat.gov.tw/" target="_blank" rel="noopener noreferrer">www.einvoice.nat.gov.tw</a>
            </p>
            <img src="/guide/01-login-link.jpg" alt="" loading="lazy" />
          </li>
          <li>
            <p data-i18n="guide.step2"></p>
            <img src="/guide/02-login-form.jpg" alt="" loading="lazy" />
          </li>
          <li>
            <p data-i18n="guide.step3"></p>
            <img src="/guide/03-query-form.jpg" alt="" loading="lazy" />
          </li>
          <li>
            <p data-i18n="guide.step4"></p>
            <img src="/guide/04-page-size.jpg" alt="" loading="lazy" />
          </li>
          <li>
            <p data-i18n="guide.step5"></p>
            <p class="guide-warning" data-i18n="guide.warning"></p>
            <img src="/guide/05-download.jpg" alt="" loading="lazy" />
          </li>
        </ol>
        <p class="hint" data-i18n="guide.then"></p>
        <div class="preview-actions">
          <button id="guide-close" type="button" data-i18n="action.close"></button>
        </div>
      </dialog>

      <dialog id="account-dialog">
        <div class="account-head">
          <h2 id="account-name"></h2>
          <p id="account-since" class="muted"></p>
        </div>

        <section class="account-section">
          <h3 data-i18n="account.tokenTitle"></h3>
          <p class="hint" data-i18n="account.tokenHint"></p>
          <p id="token-status" class="muted"></p>
          <code id="token-value" class="token" hidden></code>
          <div class="account-actions">
            <button id="token-create" type="button" class="upload"></button>
            <button id="token-revoke" type="button" data-i18n="action.revoke" hidden></button>
          </div>
        </section>

        <section class="account-section">
          <h3 data-i18n="account.webhookTitle"></h3>
          <p class="hint" data-i18n="account.webhookHint"></p>
          <form id="webhook-form" class="account-actions">
            <input id="webhook-url" type="url" inputmode="url" placeholder="https://ntfy.sh/…" />
            <button type="submit" data-i18n="action.save"></button>
          </form>
        </section>

        <div class="preview-actions">
          <button id="sign-out" type="button" data-i18n="action.signOut"></button>
          <button id="account-close" type="button" data-i18n="action.close"></button>
        </div>
      </dialog>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
