<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Invoice Gang</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#3d85c6" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="login" class="login" hidden>
      <form id="login-form">
        <h1>Invoice Gang</h1>
        <input id="password" type="password" autocomplete="current-password" placeholder="Password" />
        <button type="submit">Sign in</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>

    <div id="app" hidden>
      <header class="topbar">
        <h1>Invoice Gang</h1>
        <nav>
          <button data-view="dashboard" class="active">Spend</button>
          <button data-view="invoices">Invoices</button>
          <button data-view="review">Review</button>
          <button data-view="stats">Stats</button>
        </nav>
        <div class="range">
          <input id="from" type="date" />
          <input id="to" type="date" />
          <label class="upload" for="csv">Import CSV</label>
          <input id="csv" type="file" accept=".csv,text/csv" hidden />
        </div>
      </header>

      <div id="stale" class="banner" hidden></div>

      <main>
        <section id="view-dashboard" class="view">
          <div class="totals" id="totals"></div>
          <div class="panels">
            <div class="panel">
              <h2>By category</h2>
              <div id="chart-category"></div>
            </div>
            <div class="panel">
              <h2>By month</h2>
              <div id="chart-month"></div>
            </div>
            <div class="panel">
              <h2>Top merchants</h2>
              <div id="chart-merchant"></div>
            </div>
          </div>
        </section>

        <section id="view-invoices" class="view" hidden>
          <input id="search" type="search" placeholder="Search merchants and item descriptions…" />
          <div id="invoice-list"></div>
          <button id="load-more" hidden>Load more</button>
        </section>

        <section id="view-review" class="view" hidden>
          <p class="hint">
            Uncategorized and low-confidence items, most expensive first — fixing these is the
            fastest route to an accurate chart.
          </p>
          <div id="review-list"></div>
        </section>

        <section id="view-stats" class="view" hidden>
          <div id="stats"></div>
        </section>
      </main>

      <dialog id="detail"><div id="detail-body"></div><button id="detail-close">Close</button></dialog>

      <dialog id="preview">
        <div class="preview-head">
          <h2>Review before importing</h2>
          <p id="preview-summary" class="muted"></p>
        </div>
        <div id="preview-body"></div>
        <div class="preview-actions">
          <button id="preview-cancel">Cancel</button>
          <button id="preview-confirm" class="upload">Import selected</button>
        </div>
      </dialog>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
